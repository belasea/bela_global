<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        .offcanvas { width: 375px !important; border-left: none; }
        .offcanvas-header { background-color: #0a1628; color: white; padding: 1.25rem 1rem; }
        .offcanvas-footer { background-color: #f4f6fb; padding: 1.25rem 1rem; border-top: 1px solid #dee2e6; }
        
        /* Product Item Styling */
        .cart-item { padding: 1rem; border-bottom: 1px solid #f0f0f0; display: flex; gap: 12px; }
        .cart-item:last-child { border-bottom: none; }
        .product-img { width: 60px; height: 60px; object-fit: contain; }
        .product-title { font-size: 0.9rem; font-weight: 500; color: #1a1a1a; margin-bottom: 8px; line-height: 1.4; display: block; text-decoration: none; }
        .price-row { font-size: 1.05rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .qty-text { color: #6c757d; font-weight: 400; font-size: 0.95rem; }
        
        /* Quantity Controls */
        .qty-control { display: flex; align-items: center; border: 1px solid #dee2e6; border-radius: 4px; width: fit-content; margin-top: 10px; }
        .qty-btn { border: none; background: white; padding: 0 10px; font-size: 1.1rem; color: #3b4cb8; transition: 0.2s; }
        .qty-btn:hover { background: #f8f9fa; }
        .qty-input { width: 40px; text-align: center; border: none; border-left: 1px solid #dee2e6; border-right: 1px solid #dee2e6; font-weight: 600; pointer-events: none; }

        /* General UI */
        .btn-apply, .btn-checkout { background-color: #3b4cb8; color: white; border: none; }
        .btn-apply:hover, .btn-checkout:hover { background-color: #2a3a9d; color: white; }
        .taka-sym { font-weight: 700; color: #000; }
    </style>
</head>
<body>

    <div class="fixed-top h-100 d-flex flex-column justify-content-center align-items-end pe-0 pointer-events-none" style="z-index: 1030; pointer-events: none;">
    <button class="btn btn-primary shadow-lg d-flex flex-column align-items-center py-3 px-2" 
            type="button" 
            data-bs-toggle="offcanvas" 
            data-bs-target="#cartPanel"
            style="pointer-events: auto; border-radius: 10px 0 0 10px; width: 60px;">
        <i class="bi bi-cart3 fs-4 mb-1"></i>
        <span style="writing-mode: vertical-rl; text-orientation: mixed;" class="small fw-bold">CART (2)</span>
    </button>
</div>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartPanel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title text-uppercase fw-bold small tracking-wider">Your Cart</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>

        <div class="offcanvas-body p-0">
            <div class="cart-items-container">
                
                <div class="cart-item">
                    <img src="https://via.placeholder.com/60" alt="Projector" class="product-img">
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between">
                            <a href="#" class="product-title">XINJI PX1 100 ANSI Lumens LCD Portable Projector With Android OS</a>
                            <button class="btn btn-link p-0 text-muted"><i class="bi bi-trash3"></i></button>
                        </div>
                        <div class="price-row">
                            17,000৳ <span class="qty-text">× 1 = 17,000৳</span>
                        </div>
                        <div class="qty-control">
                            <button class="qty-btn" onclick="this.parentNode.querySelector('input').stepDown()">-</button>
                            <input class="qty-input" type="number" value="1" min="1">
                            <button class="qty-btn" onclick="this.parentNode.querySelector('input').stepUp()">+</button>
                        </div>
                    </div>
                </div>

                <div class="cart-item">
                    <img src="https://via.placeholder.com/60" alt="Laptop" class="product-img">
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between">
                            <a href="#" class="product-title">Chuwi HeroBook Pro Intel Celeron N4020 14.1 inch Full HD Laptop</a>
                            <button class="btn btn-link p-0 text-muted"><i class="bi bi-trash3"></i></button>
                        </div>
                        <div class="price-row">
                            29,900৳ <span class="qty-text">× 1 = 29,900৳</span>
                        </div>
                        <div class="qty-control">
                            <button class="qty-btn" onclick="this.parentNode.querySelector('input').stepDown()">-</button>
                            <input class="qty-input" type="number" value="1" min="1">
                            <button class="qty-btn" onclick="this.parentNode.querySelector('input').stepUp()">+</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div class="offcanvas-footer">
            <div class="input-group mb-3">
                <input type="text" class="form-control form-control-sm rounded-0" placeholder="Promo Code">
                <button class="btn btn-apply btn-sm px-4 rounded-0">Apply</button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-1">
                <span class="text-secondary">Sub-Total</span>
                <span class="taka-sym">46,900৳</span>
            </div>
            <hr class="my-2 opacity-25">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <span class="text-secondary fs-5">Total</span>
                <span class="taka-sym fs-5">46,900৳</span>
            </div>
            
            <div class="d-grid">
                <a href="#" class="btn btn-checkout btn-lg rounded-0 fw-bold shadow-sm">CHECKOUT</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
