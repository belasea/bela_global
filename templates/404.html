{% extends 'base.html' %}
{% load static %}
{% block title %} 404 - {{block.super}} {% endblock %}

{% block content %}

    <section class="error-404 d-flex align-items-center justify-content-center min-vh-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="error-card text-center p-5">
                        <h1 class="display-1 fw-bold text-danger mb-3">404</h1>
                        <h4 class="mb-3">Oops! Page not found</h4>
                        <p class="text-muted mb-4">
                            The page you are looking for doesn’t exist or may have been moved.
                        </p>
                        <a href="{% url 'home' %}" class="btn btn-primary btn-lg px-5">
                            Go Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>


{% endblock %}
