{% extends 'dashboard/base_dashboard.html' %}
{% load static %}
{% block title %} Delete Address {{block.super}} {% endblock %}

{% block content %}


<section class="delete-billing-address">
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="row justify-content-center">
            <div class="col">
                <div class="card border-danger">
                    <div class="card-body">
                        <form method="POST">
                            <!-- Security token -->
                            {% csrf_token %}
                            <h2 class="text-center"><i class="fa fa-trash" style="font-size: 100px"></i></h2>
                            <h4 class="text-center mb-3">Are you sure you want to delete this address?</h4>
                            <div class="text-center mb-5">
                                <input type="submit" class="btn btn-danger mx-2" value="Yes"/>
                                <a href="{% url 'address' %}" class="btn btn-primary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>




{% endblock %}
