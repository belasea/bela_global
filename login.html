<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jayed Hossain Jibon">
    <meta name='designer' content='Jayed Hossain Jibon'>
    <title>Login - BellaGlobal</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css" rel="stylesheet"/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">
    
</head>
<body>

    <!--===== Main Content ====-->
    <section class="login">
        <section class="d-flex align-items-center" style="min-height: 100vh;">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-sm-12 col-md-4 col-lg-4 col-xl-4">
                        <!-- Message -->
                        <div class="text-center">
                            <!-- 
                            {% if messages %}
                                {% for message in messages %}
                                <div class="alert {{ message.tags }} alert-dismissible fade show text-center" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                                {% endfor %}
                            {% endif %}
                            -->
                        </div>
                        <div class="main-form">
                            <div class="card mb-2">
                                <div class="card-header pb-1 text-center">
                                    <h2>
                                        <a href="index.html" class="text-decoration-none fw-bold">
                                        Login - TheBella
                                        </a>
                                    </h2>
                                </div>
                                <div class="card-body">
                                    <form action="" method="POST">
                                        <br>
                                        <!-- Email Address -->
                                        <div class="form-group mb-4">
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                                                <input type="email" name="email" class="form-control" placeholder="Enter your email address">
                                            </div>
                                        </div>
                                        <!-- Password -->
                                        <div class="form-group mb-4">
                                            <div class="input-group">
                                                <span class="input-group-text">
                                                    <i class="fa fa-key"></i>  
                                                </span>
                                                <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Password">
                                                <span class="input-group-text" style="cursor: pointer;" onclick="togglePassword()">
                                                    <i class="fa fa-eye" id="toggleIcon"></i>
                                                </span>
                                            </div>
                                        </div>
                                        <div class="d-grid gap-2 mb-2">
                                            <button type="submit" class="login-btn text-center">
                                                <i class="fas fa-sign-in-alt"></i> Login
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                            <p class="text-center text-white">
                                Don't have an account yet ?
                                <a href="singup.html" class="mx-2 text-white"> Register </a>
                            </p>
                            <div class="text-center text-white">
                                <a href="" class="btn btn-outline-light btn-sm">
                                    Forgot your password?
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            const toggleIcon = document.getElementById('toggleIcon');
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = "password";
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
    </script>  

   
    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

    <!-- Jump to Top Button -->
    <button id="jumpToTop" class="jump-to-top-btn" aria-label="Jump to top">
        <i class="bi bi-chevron-up"></i>
    </button>
   
</body>
</html>
